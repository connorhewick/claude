name: Claude PR Walkthrough Prep

# Advisory auto-review triggered when connorhewick is tagged, assigned,
# or requested as a reviewer on a PR. Writes a walkthrough PLAN to the
# `claude-memory` branch — never comments on the PR. A live Claude Code
# session later reads the plan, walks the human through it, interviews
# them per AGENTS.md, and only then posts consolidated advisory comments.

on:
  pull_request:
    types: [opened, reopened, synchronize, review_requested, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: claude-pr-walkthrough-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  TARGET_USER: connorhewick
  MEMORY_BRANCH: claude-memory

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      trigger: ${{ steps.decide.outputs.trigger }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != '' }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_NUM_PR: ${{ github.event.pull_request.number }}
          PR_NUM_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          target="$TARGET_USER"
          run=false
          pr_number=""
          trigger=""

          contains_mention() {
            printf '%s' "$1" | grep -qiE "(^|[^A-Za-z0-9_])@${target}([^A-Za-z0-9_]|$)"
          }

          case "$EVENT_NAME" in
            pull_request)
              pr_number="$PR_NUM_PR"
              case "$ACTION" in
                review_requested)
                  if [ "$REVIEWER" = "$target" ]; then run=true; trigger="review_requested"; fi
                  ;;
                assigned)
                  if [ "$ASSIGNEE" = "$target" ]; then run=true; trigger="assigned"; fi
                  ;;
                opened|reopened)
                  if contains_mention "$PR_BODY"; then run=true; trigger="mention_in_body"; fi
                  ;;
                synchronize)
                  # Only regenerate if a pending plan exists for this PR;
                  # the plan-existence check happens in the prepare job.
                  if contains_mention "$PR_BODY"; then run=true; trigger="synchronize"; fi
                  ;;
              esac
              ;;
            issue_comment)
              if [ "$IS_PR_COMMENT" = "true" ] && contains_mention "$COMMENT_BODY"; then
                run=true
                trigger="mention_in_comment"
                pr_number="$PR_NUM_ISSUE"
              fi
              ;;
            pull_request_review_comment)
              if contains_mention "$COMMENT_BODY"; then
                run=true
                trigger="mention_in_review_comment"
                pr_number="$PR_NUM_PR"
              fi
              ;;
          esac

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"

  prepare:
    needs: filter
    if: needs.filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ needs.filter.outputs.pr_number }}
      TRIGGER: ${{ needs.filter.outputs.trigger }}
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          data=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          head_sha=$(printf '%s' "$data" | jq -r .head.sha)
          base_ref=$(printf '%s' "$data" | jq -r .base.ref)
          head_ref=$(printf '%s' "$data" | jq -r .head.ref)
          title=$(printf '%s' "$data" | jq -r .title)
          author=$(printf '%s' "$data" | jq -r .user.login)
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          {
            echo "title<<EOF"
            echo "$title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base + memory branch (auto-init if missing)
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.pr.outputs.base_ref }}"
          if ! git ls-remote --exit-code --heads origin "$MEMORY_BRANCH" >/dev/null 2>&1; then
            echo "$MEMORY_BRANCH does not exist on origin — seeding it now via scripts/init-claude-memory.sh"
            bash scripts/init-claude-memory.sh origin
          fi
          git fetch origin "$MEMORY_BRANCH":refs/remotes/origin/"$MEMORY_BRANCH"
          git worktree add ../memory "origin/$MEMORY_BRANCH"

      - name: Skip synchronize if no pending plan
        if: env.TRIGGER == 'synchronize'
        id: pending_check
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=(../memory/walkthroughs/PR-${PR_NUMBER}-*.md)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "No pending walkthrough for PR-$PR_NUMBER — synchronize is a no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture PR diff
        if: steps.pending_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude-review
          git diff "origin/${{ steps.pr.outputs.base_ref }}...HEAD" > /tmp/claude-review/pr.diff
          git diff --stat "origin/${{ steps.pr.outputs.base_ref }}...HEAD" > /tmp/claude-review/pr.stat

      - name: Run Claude to write walkthrough plan
        if: steps.pending_check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are preparing an advisory walkthrough plan for PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.

            RULES — READ FIRST:
            - DO NOT post any comment, review, or reaction on the PR. Zero PR-visible output.
            - You write ONLY to the local worktree at ../memory (checked out to the `claude-memory` branch).
            - Everything you produce is a DRAFT the human will interview against before it becomes public.

            Context:
            - PR title: ${{ steps.pr.outputs.title }}
            - Author: @${{ steps.pr.outputs.author }}
            - Base: ${{ steps.pr.outputs.base_ref }}
            - Head: ${{ steps.pr.outputs.head_ref }} @ ${{ steps.pr.outputs.head_sha }}
            - Trigger: ${{ env.TRIGGER }}
            - Diff: /tmp/claude-review/pr.diff
            - Diffstat: /tmp/claude-review/pr.stat

            Steps:
            1. Read ../memory/walkthroughs/README.md for the plan-file format spec.
            2. Read the diff and the files it touches at HEAD to understand the change in review order.
            3. Compute a URL-safe slug from the PR title (lowercase, hyphens, <= 40 chars).
               Plan file path: ../memory/walkthroughs/PR-${{ env.PR_NUMBER }}-<slug>.md
               If a file matching ../memory/walkthroughs/PR-${{ env.PR_NUMBER }}-*.md already exists,
               overwrite THAT file (keep the existing slug — the TODO entry stays valid).
            4. Write the plan following the README's format: summary, review order with file:line refs,
               decision points to interview the human on, and DRAFT advisory findings prefixed
               with "DRAFT — do not post until walkthrough+interview complete".
            5. Update ../memory/WALKTHROUGHS_TODO.md — add an unchecked entry under "## Pending"
               linking to the plan file with today's date and the trigger. If an entry for this PR
               already exists under Pending, refresh its date + trigger in place (do not duplicate).
            6. Commit and push:
                 cd ../memory
                 git add -A
                 git -c user.name="claude-pr-review[bot]" \
                     -c user.email="claude-pr-review@users.noreply.github.com" \
                     commit -m "chore(walkthrough): queue PR-${{ env.PR_NUMBER }} (${{ env.TRIGGER }})"
                 git push origin HEAD:${{ env.MEMORY_BRANCH }}

            If anything is unclear from the diff alone (e.g., the change references a config file
            not in the PR), note it under "Decision points" — do NOT invent answers.
